[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggriculture-hasegawa-jax-v1"
version = "0.1.0"
description = "State-driven JAX reproduction of the Hasegawa rank-1 business policy"
requires-python = ">=3.12"
dependencies = [
  "jax>=0.7",
  "numpy>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = [
  "src",
  "../general_project_planner_v1/src",
  "../kaggriculture_execution_core/src",
  "../../gpu_sim/src",
]

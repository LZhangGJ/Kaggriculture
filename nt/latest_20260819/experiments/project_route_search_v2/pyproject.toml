[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggriculture-project-route-search-v2"
version = "0.0.0"
description = "Fixed-shape three-layer route-search contracts for Kaggriculture 1.32.7"
requires-python = ">=3.12"
dependencies = [
  "jax>=0.7",
  "flax>=0.12",
  "numpy>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = [
  "src",
  "../../gpu_sim/src",
  "../strategic_v5/src",
]

name: Arena checks
on:
  push:
    paths: ['tools/arena/**', 'tests/arena/**', '.github/workflows/arena-checks.yml']
  pull_request:
    paths: ['tools/arena/**', 'tests/arena/**', '.github/workflows/arena-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy tzdata
      - run: python -m unittest discover -s tests/arena -v

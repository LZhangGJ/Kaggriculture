[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaggriculture-lab"
version = "0.1.0"
description = "Fast, reproducible local simulation tools for Kaggriculture"
requires-python = ">=3.11"
dependencies = [
    "kaggle-environments==1.32.6",
]

[project.optional-dependencies]
dev = ["pytest>=9"]
gpu = ["numpy>=1.26", "torch>=2.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/kaggriculture_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
